# Dev environment overrides
replicaCount: 1

image:
  tag: "dev-latest"

service:
  type: NodePort
  port: 80
  targetPort: 3000

ingress:
  host: myapp-dev.local

resources:
  requests:
    memory: "32Mi"
    cpu: "50m"
  limits:
    memory: "64Mi"
    cpu: "100m"

env:
  APP_ENV: "development"
  APP_VERSION: "v1-dev"
